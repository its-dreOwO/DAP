name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black
      - name: Black formatting check
        run: black --check --line-length=88 app/ src-code/

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Flake8 lint
        run: flake8 app/ src-code/ --max-line-length=88 --extend-ignore=E203,W503 --exclude=app/.venv,app/venv,.venv
